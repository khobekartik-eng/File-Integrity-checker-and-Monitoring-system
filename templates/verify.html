{% extends 'base.html' %}{% block title %}Verify integrity{% endblock %}{% block content %}<section class="card formcard"><h2>Compare file with baseline</h2>{% if baselines %}<form method="post" enctype="multipart/form-data"><label>Saved baseline<select name="baseline_id" required>{% for b in baselines %}<option value="{{ b.id }}">#{{ b.id }} · {{ b.filename }} · {{ b.sha256[:12] }}…</option>{% endfor %}</select></label><label>File to verify<input type="file" name="file" required></label><button>Run integrity check</button></form>{% else %}<p>Create a baseline first.</p><a class="button" href="/baseline">Create baseline</a>{% endif %}</section>{% endblock %}
